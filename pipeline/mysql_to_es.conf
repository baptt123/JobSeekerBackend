output {
  if [type] == "companies" {
    elasticsearch { hosts => ["http://host.docker.internal:9200"] index => "companies" document_id => "%{company_id}" }
  }
  else if [type] == "users" {
    elasticsearch { hosts => ["http://host.docker.internal:9200"] index => "users" document_id => "%{user_id}" }
  }
  else if [type] == "roles" {
    elasticsearch { hosts => ["http://host.docker.internal:9200"] index => "roles" document_id => "%{role_id}" }
  }
  else if [type] == "user_cvs" {
    elasticsearch { hosts => ["http://host.docker.internal:9200"] index => "user_cvs" document_id => "%{cv_id}" }
  }
  else if [type] == "skills" {
    elasticsearch { hosts => ["http://host.docker.internal:9200"] index => "skills" document_id => "%{skill_id}" }
  }
  else if [type] == "jobs" {
    elasticsearch { hosts => ["http://host.docker.internal:9200"] index => "jobs" document_id => "%{job_id}" }
  }
  else if [type] == "job_skills" {
    elasticsearch { hosts => ["http://host.docker.internal:9200"] index => "job_skills" document_id => "%{job_id}_%{skill_id}" }
  }
  else if [type] == "job_applications" {
    elasticsearch { hosts => ["http://host.docker.internal:9200"] index => "job_applications" document_id => "%{application_id}" }
  }
  else if [type] == "saved_jobs" {
    elasticsearch { hosts => ["http://host.docker.internal:9200"] index => "saved_jobs" document_id => "%{user_id}_%{job_id}" }
  }
  else if [type] == "messages" {
    elasticsearch { hosts => ["http://host.docker.internal:9200"] index => "messages" document_id => "%{message_id}" }
  }
  else if [type] == "notifications" {
    elasticsearch { hosts => ["http://host.docker.internal:9200"] index => "notifications" document_id => "%{notification_id}" }
  }

  stdout { codec => json_lines }
}
